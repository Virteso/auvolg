# Serves the static site (minified in production), plus /assets and built scripts.
# Paths are resolved from environment by entrypoint.sh.

# CSP and Permissions-Policy resolve to an empty value for non-HTML responses,
# which makes nginx omit those headers. The two static headers are safe on all
# responses. Applied at server level so the location-level Cache-Control
# headers below still work as before.
add_header Content-Security-Policy $security_csp always;
add_header Permissions-Policy $security_permissions_policy always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy "no-referrer" always;

# Contact-form relay to the mailer service (rate limited, internal network only)
location = /api/contact {
	include /etc/nginx/snippets/contact-ratelimit.conf;
}

location / {
	# Production serves minified HTML from the build volume; dev serves src/.
	include /etc/nginx/generated/html-root.conf;
	gzip_static on;
	index index.html;
	try_files $uri $uri/ =404;
}

location /assets/ {
	include /etc/nginx/generated/assets-alias.conf;
	access_log off;
	log_not_found off;
	add_header Cache-Control "public, max-age=86400";
}

location = /script.js {
	include /etc/nginx/generated/script-alias.conf;
	default_type application/javascript;
	gzip_static on;
	access_log off;
	log_not_found off;
	add_header Cache-Control "public, max-age=0, must-revalidate";
}

location = /styles.css {
	include /etc/nginx/generated/style-alias.conf;
	default_type text/css;
	gzip_static on;
	access_log off;
	log_not_found off;
	add_header Cache-Control "public, max-age=0, must-revalidate";
}
