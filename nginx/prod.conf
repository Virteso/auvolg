server {
	server_tokens off;
	#more_clear_headers Server;
	include /etc/nginx/generated/server_name.conf;

	# location /static/ (alias resolved from STATIC_DIR)
	include snippets/static.conf;

	# Static site in /src, plus /assets and built scripts
	include snippets/site.conf;

	http2 on;
	listen [::]:443 ssl;
	listen 443 ssl;
	listen [::]:443 quic reuseport;
	listen 443 quic reuseport;
	ssl_certificate /etc/letsencrypt/live/auvolg.ee/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/auvolg.ee/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
	add_header Alt-Svc 'h3=":443"; ma=86400' always;
}

# Redirect HTTP to HTTPS
include snippets/https-redirect.conf;
