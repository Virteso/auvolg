services:
  # Frontend JS build service
  bun:
    image: docker.io/oven/bun:alpine
    working_dir: /js
    restart: on-failure:3
    volumes:
      - ./js:/js
      - staticfiles:${STATIC_DIR:-/staticfiles}
    environment:
      PIPELINE: ${PIPELINE:-production}
      STATIC_DIR: ${STATIC_DIR:-/staticfiles}
      BUILD_MARKER: ${STATIC_DIR:-/staticfiles}/.bun-build-complete
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Remove completion marker before rebuilding if it exists
        rm -f "$$BUILD_MARKER"
        bun install
        bun run build.js &
        PID=$$!
        trap 'kill -TERM $$PID' SIGTERM SIGINT
        wait "$$PID"

