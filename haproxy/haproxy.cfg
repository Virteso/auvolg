# HAProxy configuration TEMPLATE.
#
# This file is rendered by haproxy/entrypoint.sh into /run/haproxy/haproxy.cfg.
# Lines of the form @@NAME@@ are replaced with generated fragments:
#   @@BUF_SIZE_LINE@@    tune.bufsize sized to the largest served file
#   @@HTTP_RULES@@       HTTP -> HTTPS redirect (production) or nothing (dev)
#   @@HTTPS_FRONTEND@@   full TLS/HTTP2/HTTP3 frontend (production only)
#   @@STATIC_BACKEND@@   one http-request return rule per static file
#
# Do not edit the rendered file; edit this template or the site files instead.

global
    maxconn 2000
@@BUF_SIZE_LINE@@
    tune.maxrewrite 1024
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
    # The container runs entirely as the unprivileged `haproxy` user. Ports
    # 80/443 are bindable thanks to net.ipv4.ip_unprivileged_port_start=80.
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout queue 30s

frontend fe_http
    bind :80
    bind :::80 v6only
@@HTTP_RULES@@
    default_backend be_static

@@HTTPS_FRONTEND@@

@@STATIC_BACKEND@@
