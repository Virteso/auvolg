.if streq("$PIPELINE",production)
frontend fe_https
    bind :443 ssl crt /etc/haproxy/certs/site.pem alpn h2,http/1.1
    bind :::443 ssl crt /etc/haproxy/certs/site.pem alpn h2,http/1.1 v6only
    bind quic4@:443 ssl crt /etc/haproxy/certs/site.pem alpn h3
    bind quic6@[::]:443 ssl crt /etc/haproxy/certs/site.pem alpn h3 v6only
    http-after-response set-header Alt-Svc "h3=\":443\"; ma=86400"
    default_backend be_static
.endif
