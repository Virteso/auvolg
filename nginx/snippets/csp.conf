# Site-wide Content-Security-Policy. Included from nginx.conf as a map definition
# Empty value -> header omitted (non-HTML responses, e.g. CSS/JS or /uuringud/api/*).
# The site is served directly from disk, so $sent_http_content_type is the
# response type actually sent to the client (there is no upstream response).
map $sent_http_content_type $security_csp {
	default "";
	~^text/html "default-src 'none'; base-uri 'none'; form-action 'self'; script-src 'self'; connect-src 'self'; style-src 'self'  https://fonts.googleapis.com/; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com/;";
}
