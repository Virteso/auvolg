# Serves the compiled JS/CSS bundles plus everything collectstatic copied here.

location = /favicon.ico {
	root /;
	access_log off;
	log_not_found off;
	expires 30d;	# Caches the icon for 30 days to improve performance
	add_header Cache-Control "public, max-age=86400, immutable";
}

location /static/ {
	# The alias line is resolved from STATIC_DIR by entrypoint.sh.
	include /etc/nginx/generated/static-alias.conf;

	# Serve pre-compressed files if they exist (compressed by build.js)
	gzip_static on;

	location ~ /\. {
		deny all;
	}

	access_log off;
	log_not_found off;
	add_header Cache-Control "public, max-age=0, must-revalidate";
}
