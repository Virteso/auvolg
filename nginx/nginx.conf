user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	server_tokens off;
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
					'$status $body_bytes_sent "$http_referer" '
					'"$http_user_agent" "$http_x_forwarded_for"';

	access_log /var/log/nginx/access.log main;

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;

	# Upload commits include rows, tracks, and duplicate-review snapshots.
	# Keep aligned with Django DATA_UPLOAD_MAX_MEMORY_SIZE.
	client_max_body_size 32m;

	# Security header policies. (use maps, which are only valid in http context)
	include /etc/nginx/snippets/csp.conf;
	include /etc/nginx/snippets/permissions.conf;

	# Contact-form relay rate limit (used in snippets/contact-ratelimit.conf).
	limit_req_zone $binary_remote_addr zone=contact:1m rate=1r/m;
	limit_req_log_level warn;

	# Gzip compression
	gzip on;
	gzip_vary on;
	gzip_comp_level 4;
	gzip_min_length 256;
	gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
	gzip_types
		text/plain
		text/css
		text/xml
		text/javascript
		text/cache-manifest
		application/x-javascript
		application/xml+rss
		application/rss+xml
		application/xml
		application/json
		application/javascript
		image/svg+xml
		image/x-icon;

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
