# Permissions-Policy. Included from nginx.conf as a map definition
# Empty value -> header omitted (non-HTML responses).
# The site is served directly from disk, so $sent_http_content_type is the
# response type actually sent to the client (there is no upstream response).
map $sent_http_content_type $security_permissions_policy {
	default "";
	~^text/html "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), fullscreen=(self)";
}