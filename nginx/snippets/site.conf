# Serves the static site from /src, plus /assets and built scripts.
# Paths are resolved from environment by entrypoint.sh.

location / {
	include /etc/nginx/generated/site-root.conf;
	index index.html;
	try_files $uri $uri/ =404;
}

location /assets/ {
	include /etc/nginx/generated/assets-alias.conf;
	access_log off;
	log_not_found off;
	add_header Cache-Control "public, max-age=86400";
}

location = /script.js {
	include /etc/nginx/generated/script-alias.conf;
	default_type application/javascript;
	access_log off;
	log_not_found off;
	add_header Cache-Control "public, max-age=0, must-revalidate";
}
