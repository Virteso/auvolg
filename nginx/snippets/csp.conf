# Site-wide Content-Security-Policy. Included from nginx.conf as a map definition
# Empty value -> header omitted (non-HTML responses, e.g. /uuringud/api/*).
map $upstream_http_content_type $security_csp {
	default "";
	~^text/html "default-src 'none'; base-uri 'none'; form-action 'self'; script-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' data:";
}
