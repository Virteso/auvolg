services:
  # Frontend JS build service
  bun:
    image: docker.io/oven/bun:alpine
    working_dir: /js
    restart: on-failure:3
    volumes:
      - ./js:/js
      - ./src:/site-src:ro
      - staticfiles:${STATIC_DIR:-/staticfiles}
    environment:
      PIPELINE: ${PIPELINE:-production}
      STATIC_DIR: ${STATIC_DIR:-/staticfiles}
      SITE_SRC_DIR: ${SITE_SRC_DIR:-/site-src}
      BUILD_MARKER: ${STATIC_DIR:-/staticfiles}/.bun-build-complete
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Remove completion marker before rebuilding if it exists
        rm -f "$$BUILD_MARKER"
        bun install
        if [ "$$PIPELINE" = "production" ]; then
          echo "Building production bundle..."
          bun run build.js &
        else
          echo "Building development bundle..."
          bun run dev-build.js &
        fi
        PID=$$!
        trap 'kill -TERM $$PID' SIGTERM SIGINT
        wait "$$PID"


  # Contact-form mail relay (OCI Email Delivery over SMTP)
  mailer:
    build:
      context: .
      dockerfile: mailer/Dockerfile
    stop_signal: SIGTERM
    # Let the relay finish SMTP sends already in flight (nginx allows 30s).
    stop_grace_period: 40s
    restart: on-failure:3
    environment:
      MAILER_PORT: 8080
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_DEFAULT_FROM: ${EMAIL_DEFAULT_FROM}
      EMAIL_CONTACT_TO: ${EMAIL_CONTACT_TO}
    networks:
      - internal


  # Nginx reverse proxy service
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.nginx
    restart: on-failure:3
    ports:
      - "${PORT_HTTP:-8080}:80"
      - "${PORT_HTTPS:-8443}:443/tcp"
      - "${PORT_HTTPS:-8443}:443/udp"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/snippets:/etc/nginx/snippets
      - ./nginx/dev.conf:/etc/nginx/dev.conf
      - ./nginx/prod.conf:/etc/nginx/prod.conf
      - ./nginx/favicon.ico:/favicon.ico:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./src:/usr/share/site/src:ro
      - ./src/assets:/usr/share/site/assets:ro
      - staticfiles:${STATIC_DIR:-/staticfiles}
      - letsencrypt:/etc/letsencrypt
      - certbot_cache:/var/cache/certbot
    environment:
      PIPELINE: ${PIPELINE:-production}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      STATIC_DIR: ${STATIC_DIR:-/staticfiles}
      SITE_DIR: /usr/share/site/src
      ASSETS_DIR: /usr/share/site/assets
      DOMAIN: ${DOMAIN}
      PORT_HTTP: ${PORT_HTTP:-8080}
      PORT_HTTPS: ${PORT_HTTPS:-8443}
    depends_on:
      - bun
      - mailer
    networks:
      - internal


networks:
  internal:

volumes:
  staticfiles:
  letsencrypt:
  certbot_cache:
